<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="weather-checker">
        <h1>WEATHER APP</h1>
        <div class="search">
            <input type="text" id="input-city" placeholder="Enter City Name..."/>
            <button class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <div class="container">
            <div class="weather-display">
                <img id="weather-icon" src="" alt="Weather Icon">
                <h1 id="temp-display">40°C</h1>
                <h2 id="city-name">City Name</h2>
                <p id="weather-condition">Climate Condition</p>
            </div>
            <div class="weather-detail">
                <div class="humidity">
                    <i class="fa-solid fa-droplet"></i>
                    <p class="humidity-display">Humidity:0%</p>
                </div>
                <div class="wind">
                    <i class="fa-solid fa-wind"></i>
                    <p class="wind-display">Wind:0.0km/h</p>
                </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
